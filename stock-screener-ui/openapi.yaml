info:
  contact:
    name: Alphashri Support
  description: 'Market data, screener, paper-trading and bot APIs for Indian (NSE) and US markets.


    ## Authentication

    1. `POST /api/auth/login` with `{"email": "...", "password": "..."}`.

    2. Copy `access_token` from the response.

    3. Click **Authorize** (top right), paste the token into the `bearerAuth` field.

    4. Send requests; the UI adds `Authorization: Bearer <token>`.


    ## Notes

    - Base URL in local development: `http://localhost:8765`.

    - WebSocket routes (`/ws/orderflow`, `/ws/nifty/*`) are not represented in this schema.

    - Endpoints marked with a padlock require a bearer token.

    '
  license:
    name: Proprietary
  title: Alphashri API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/52w-range:
    get:
      description: Get 52-week high/low for a single symbol. Checks Redis first, falls back to DB.
      operationId: get_52w_range_api_52w_range_get
      parameters:
      - in: query
        name: symbol
        required: true
        schema:
          title: Symbol
          type: string
      responses:
