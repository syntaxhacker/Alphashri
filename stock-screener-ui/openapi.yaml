          title: Broker
      - in: query
        name: start
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Start
      - in: query
        name: end
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: End
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
