    bearerAuth:
      description: 'JWT access token from POST /api/auth/login (sent as ''Authorization: Bearer <token>'').'
      scheme: bearer
      type: http
info:
  contact:
    name: Alphashri Support
  description: 'Market data, screener, paper-trading and bot APIs for Indian (NSE) and US markets.


    ## Authentication

    1. `POST /api/auth/login` with `{"email": "...", "password": "..."}`.

    2. Copy `access_token` from the response.

    3. Click **Authorize** (top right), paste the token into the `bearerAuth` field.

    4. Send requests; the UI adds `Authorization: Bearer <token>`.


    ## Notes

    - Base URL in local development: `http://localhost:8765`.

    - WebSocket routes (`/ws/nifty/*`) are not represented in this schema.

    - Endpoints marked with a padlock require a bearer token.

    '
  license:
    name: Proprietary
  title: Alphashri API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/52w-range:
    get:
      description: 'Get 52-week high/low for one symbol from the bulk range cache.


        The per-symbol ``52w_range:{symbol}`` keys are gone: the bulk key already

        holds every row, so there is one cached payload to read regardless of how

        many symbols are requested.'
      operationId: get_52w_range_api_52w_range_get
      parameters:
      - in: query
        name: symbol
        required: true
        schema:
          title: Symbol
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 52-week range for one symbol
      tags:
      - screener
  /api/52w-range/bulk:
    get:
      description: 'Get 52W ranges for all symbols. Returns dict of {symbol: {high, low, close}}.'
      operationId: get_52w_range_bulk_api_52w_range_bulk_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: 52-week ranges for many symbols
      tags:
      - screener
  /api/admin/52w-range-status:
    get:
      description: 52W Upstox batch job progress + DB coverage (admin only).
      operationId: get_52w_range_status_api_admin_52w_range_status_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - bearerAuth: []
      summary: Get 52W Range Status
      tags:
      - admin
  /api/admin/52w-range/cache:
    delete:
      description: Clear 52W Redis cache; optionally wipe DB for a full refresh.
      operationId: delete_52w_range_cache_api_admin_52w_range_cache_delete
      parameters:
      - description: Also delete all stock_52w_range rows so the next batch processes full EQ universe
        in: query
        name: clear_db
        required: false
        schema:
          default: false
          description: Also delete all stock_52w_range rows so the next batch processes full EQ universe
          title: Clear Db
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Delete 52W Range Cache
      tags:
      - admin
  /api/admin/52w-range/run:
    post:
      description: Start Upstox 52W range batch in background (admin only).
      operationId: run_52w_range_batch_api_admin_52w_range_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Run52wRangeRequest'
              default:
                full_refresh: false
                limit: 0
                redis: true
                skip_existing: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Run 52W Range Batch
      tags:
      - admin
  /api/admin/cache-keys:
    get:
      operationId: get_cache_keys_endpoint_api_admin_cache_keys_get
      parameters:
      - description: Filter by key prefix (e.g. backtest, news, screener, chart)
        in: query
        name: prefix
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by key prefix (e.g. backtest, news, screener, chart)
