openapi: 3.1.0
info:
  title: Alphashri API
  description: Stock screener and paper trading API for Indian markets
  version: 1.0.0
  contact:
    name: Alphashri Support

servers:
  - url: http://localhost:8765
    description: Local development server

tags:
  - name: health
    description: Health check endpoints
  - name: auth
    description: Authentication and user management
  - name: screeners
    description: Stock screener endpoints
  - name: backtest
    description: Backtesting endpoints
  - name: paper-trading
    description: Paper trading endpoints
  - name: bots
    description: Multi-strategy bot management
  - name: strategies
    description: Strategy configuration management
  - name: market-ticker
    description: Live market data for indices and commodities
  - name: symbols
    description: Symbol search endpoints
  - name: chart
    description: Chart preview endpoints
  - name: news
    description: News feed endpoints

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                required: [status, timestamp]

  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Login and get tokens
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required: [refresh_token]
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Logout and revoke session
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get current user info
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [auth]
      summary: Update current user settings
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      parameters:
        - name: display_name
          in: query
          schema:
            type: string
        - name: initial_capital
          in: query
          schema:
            type: number
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/screeners:
    get:
      tags: [screeners]
      summary: Get available screeners
      operationId: getScreeners
      responses:
        '200':
          description: List of available screeners
          content:
            application/json:
              schema:
                type: object
                properties:
                  default:
                    type: string
                  screeners:
                    type: array
                    items:
                      type: string
                  meta_by_id:
                    type: object
                    additionalProperties:
                      type: object

  /api/screener:
    get:
      tags: [screeners]
      summary: Get screener data
      operationId: getScreenerData
      parameters:
        - name: provider
          in: query
          schema:
            type: string
            default: upstox
        - name: mode
          in: query
          schema:
            type: string
            default: intraday
            enum: [intraday, historical]
        - name: screener
          in: query
          schema:
            type: string
            default: trending
        - name: trend
          in: query
          schema:
            type: string
            enum: [all, bullish, bearish, strong_trend]
        - name: direction
          in: query
          schema:
            type: string
            enum: [both, bullish, bearish]
        - name: min_atr_pct
          in: query
          schema:
            type: number
        - name: min_rsi
          in: query
          schema:
            type: number
        - name: min_score
          in: query
          schema:
            type: number
        - name: min_vol_surge
          in: query
          schema:
            type: number
        - name: max_52w_gap
          in: query
          schema:
            type: number
        - name: max_rsi
          in: query
          schema:
            type: number
        - name: min_stoch_k
          in: query
          schema:
            type: number
        - name: min_gap_pct
          in: query
          schema:
            type: number
        - name: min_volume_m
          in: query
          schema:
            type: number
        - name: min_wick_pct
          in: query
          schema:
            type: number
        - name: min_interest_score
          in: query
          schema:
            type: number
        - name: min_impact
          in: query
          schema:
            type: number
        - name: min_cap_b
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Screener data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenerResponse'

  /api/backtest/strategies:
    get:
      tags: [backtest]
      summary: Get available backtest strategies
      operationId: getBacktestStrategies
      responses:
        '200':
          description: List of strategies
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        params:
                          type: object

  /api/backtest/costs:
    get:
      tags: [backtest]
      summary: Get trading cost configuration
      operationId: getBacktestCosts
      responses:
        '200':
          description: Cost configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  brokerage_pct:
                    type: number
                  min_brokerage:
                    type: number
                  stt_pct:
                    type: number
                  exchange_pct:
                    type: number
                  sebi_pct:
                    type: number
                  stamp_pct:
                    type: number
                  gst_pct:
                    type: number

  /api/backtest/progress:
    get:
      tags: [backtest]
      summary: Get backtest progress
      operationId: getBacktestProgress
      responses:
        '200':
          description: Progress state
          content:
            application/json:
              schema:
                type: object
                properties:
                  running:
                    type: boolean
                  current:
                    type: integer
                  total:
                    type: integer
                  message:
                    type: string

  /api/backtest/run:
    post:
      tags: [backtest]
      summary: Run a backtest
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRunRequest'
      parameters:
        - name: include_chart_data
          in: query
          schema:
            type: boolean
            default: false
          description: Include candle/chart data in response
      responses:
        '200':
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestRunResponse'

  /api/backtest/chart/{symbol}:
    get:
      tags: [backtest]
      summary: Get chart data for a symbol
      operationId: getBacktestChart
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chart data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'
        '404':
          description: No chart data available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/backtest/results:
    get:
      tags: [backtest]
      summary: Get cached backtest results
      operationId: getBacktestResults
      responses:
        '200':
          description: Cached results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  config:
                    type: object

  /api/symbols/search:
    get:
      tags: [symbols]
      summary: Search for stock symbols
      operationId: searchSymbols
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolSearchResponse'

  /api/chart/preview/{symbol}:
    get:
      tags: [chart]
      summary: Get chart preview for a symbol
      operationId: getChartPreview
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 15
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 1
        - name: or_minutes
          in: query
          schema:
            type: integer
            minimum: 15
            maximum: 90
            default: 45
      responses:
        '200':
          description: Chart preview data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartPreviewResponse'

  /api/news:
    get:
      tags: [news]
      summary: Get latest news
      operationId: getNews
      parameters:
        - name: source
          in: query
          schema:
            type: string
            default: moneycontrol
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: News items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsResponse'
        '503':
          description: News API not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/news/article:
    get:
      tags: [news]
      summary: Get full article content
      operationId: getNewsArticle
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Article content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleContent'
        '500':
          description: Error fetching article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/news/sources:
    get:
      tags: [news]
      summary: Get available news sources
      operationId: getNewsSources
      responses:
        '200':
          description: List of sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      type: string

  /api/paper/portfolio:
    get:
      tags: [paper-trading]
      summary: Get paper trading portfolio
      operationId: getPaperPortfolio
      responses:
        '200':
          description: Portfolio status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioStatus'

  /api/paper/reset:
    post:
      tags: [paper-trading]
      summary: Reset paper trading portfolio
      operationId: resetPaperPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capital:
                  type: number
                  default: 1000000
      responses:
        '200':
          description: Portfolio reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  portfolio:
                    $ref: '#/components/schemas/PortfolioStatus'

  /api/paper/positions:
    get:
      tags: [paper-trading]
      summary: Get open positions
      operationId: getPaperPositions
      responses:
        '200':
          description: Open positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'

  /api/paper/trades:
    get:
      tags: [paper-trading]
      summary: Get trade history
      operationId: getPaperTrades
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: date
          in: query
          schema:
            type: string
        - name: symbol
          in: query
          schema:
            type: string
        - name: strategy
          in: query
          schema:
            type: string
        - name: bot_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Trade history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeHistoryResponse'
    delete:
      tags: [paper-trading]
      summary: Delete a trade
      operationId: deletePaperTrade
      parameters:
        - name: trade_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trade deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Trade not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/paper/order:
    post:
      tags: [paper-trading]
      summary: Place a paper trading order
      operationId: placePaperOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/paper/close:
    post:
      tags: [paper-trading]
      summary: Close a position
      operationId: closePaperPosition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosePositionRequest'
      responses:
        '200':
          description: Position closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResult'
        '404':
          description: Position not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/paper/close-all:
    post:
      tags: [paper-trading]
      summary: Close all positions
      operationId: closeAllPaperPositions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: object
                  additionalProperties:
                    type: number
      responses:
        '200':
          description: All positions closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  portfolio:
                    $ref: '#/components/schemas/PortfolioStatus'

  /api/paper/update-prices:
    post:
      tags: [paper-trading]
      summary: Update prices and check SL/TP
      operationId: updatePaperPrices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: object
                  additionalProperties:
                    type: number
      responses:
        '200':
          description: Prices updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  portfolio:
                    $ref: '#/components/schemas/PortfolioStatus'
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'
                  trades_closed:
                    type: integer

  /api/paper/signals:
    get:
      tags: [paper-trading]
      summary: Get current ORB signals
      operationId: getPaperSignals
      responses:
        '200':
          description: ORB signals
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  signals:
                    type: array
                    items:
                      type: object
                  timestamp:
                    type: string
                    format: date-time

  /api/paper/bot/status:
    get:
      tags: [paper-trading]
      summary: Get paper trading bot status
      operationId: getPaperBotStatus
      responses:
        '200':
          description: Bot status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotStatus'

  /api/paper/bot/start:
    post:
      tags: [paper-trading]
      summary: Start paper trading bot
      operationId: startPaperBot
      responses:
        '200':
          description: Bot started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotStatus'
        '500':
          description: Runner script not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/paper/bot/stop:
    post:
      tags: [paper-trading]
      summary: Stop paper trading bot
      operationId: stopPaperBot
      responses:
        '200':
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotStatus'

  /api/paper/health:
    get:
      tags: [paper-trading]
      summary: Paper trading health check
      operationId: paperTradingHealth
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  portfolio_value:
                    type: number
                  open_positions:
                    type: integer
                  total_trades:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time

  /api/bots:
    get:
      tags: [bots]
      summary: List all bots
      operationId: listBots
      responses:
        '200':
          description: List of bots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotResponse'
        '500':
          description: Database not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [bots]
      summary: Create a new bot
      operationId: createBot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCreate'
      responses:
        '200':
          description: Bot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/bots/available-strategies:
    get:
      tags: [bots]
      summary: List available strategies for bots
      operationId: listAvailableStrategies
      responses:
        '200':
          description: List of strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StrategySummary'

  /api/bots/{bot_id}:
    get:
      tags: [bots]
      summary: Get a specific bot
      operationId: getBot
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
        '404':
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [bots]
      summary: Update a bot
      operationId: updateBot
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotUpdate'
      responses:
        '200':
          description: Bot updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
        '404':
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [bots]
      summary: Delete a bot
      operationId: deleteBot
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bot deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/bots/{bot_id}/start:
    post:
      tags: [bots]
      summary: Start a bot
      operationId: startBot
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
        - name: test_mode
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Bot started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  pid:
                    type: integer
                  log_file:
                    type: string
        '404':
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/bots/{bot_id}/stop:
    post:
      tags: [bots]
      summary: Stop a bot
      operationId: stopBot
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bot stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/bots/{bot_id}/status:
    get:
      tags: [bots]
      summary: Get bot status
      operationId: getBotStatus
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bot status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotStatusResponse'
        '404':
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/bots/{bot_id}/logs:
    get:
      tags: [bots]
      summary: Get bot logs
      operationId: getBotLogs
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
        - name: lines
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Bot logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: string
                  total_lines:
                    type: integer
                  showing:
                    type: integer

  /api/bots/{bot_id}/portfolio:
    get:
      tags: [bots]
      summary: Get bot portfolio
      operationId: getBotPortfolio
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bot portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotPortfolioResponse'
        '404':
          description: Bot snapshot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/bots/{bot_id}/positions:
    get:
      tags: [bots]
      summary: Get bot positions
      operationId: getBotPositions
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
        - name: strategy_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Bot positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  bot_id:
                    type: integer
                  positions:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/bots/{bot_id}/trades:
    get:
      tags: [bots]
      summary: Get bot trades
      operationId: getBotTrades
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
        - name: strategy_id
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: include_test
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Bot trades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotTradesResponse'

  /api/bots/{bot_id}/performance:
    get:
      tags: [bots]
      summary: Get bot performance
      operationId: getBotPerformance
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: integer
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Bot performance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotPerformanceResponse'

  /api/strategies:
    get:
      tags: [strategies]
      summary: List all strategies
      operationId: listStrategies
      parameters:
        - name: include_templates
          in: query
          schema:
            type: boolean
            default: false
        - name: strategy_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of strategies
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      $ref: '#/components/schemas/StrategyConfig'
                  count:
                    type: integer
    post:
      tags: [strategies]
      summary: Create a strategy
      operationId: createStrategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyCreate'
      responses:
        '200':
          description: Strategy created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  strategy:
                    $ref: '#/components/schemas/StrategyConfig'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/strategies/templates:
    get:
      tags: [strategies]
      summary: List strategy templates
      operationId: listStrategyTemplates
      responses:
        '200':
          description: List of templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/StrategyConfig'
                  count:
                    type: integer

  /api/strategies/{strategy_id}:
    get:
      tags: [strategies]
      summary: Get a strategy
      operationId: getStrategy
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Strategy details
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategy:
                    $ref: '#/components/schemas/StrategyConfig'
                  variations:
                    type: array
                    items:
                      $ref: '#/components/schemas/StrategyConfig'
        '404':
          description: Strategy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [strategies]
      summary: Update a strategy
      operationId: updateStrategy
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyUpdate'
      responses:
        '200':
          description: Strategy updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  strategy:
                    $ref: '#/components/schemas/StrategyConfig'
        '404':
          description: Strategy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [strategies]
      summary: Delete a strategy
      operationId: deleteStrategy
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Strategy deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /api/strategies/{strategy_id}/performance:
    get:
      tags: [strategies]
      summary: Get strategy performance
      operationId: getStrategyPerformance
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: integer
        - name: include_test
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Strategy performance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyPerformance'
        '404':
          description: Strategy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/market-ticker:
    get:
      tags: [market-ticker]
      summary: Get all market tickers
      operationId: getAllMarketTickers
      responses:
        '200':
          description: Market ticker data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerResponse'

  /api/market-ticker/{symbol}:
    get:
      tags: [market-ticker]
      summary: Get ticker for a specific symbol
      operationId: getMarketTicker
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            enum: ["^NSEI", "^NSEBANK", "GC=F", "SI=F", "USDINR=X", "CL=F"]
      responses:
        '200':
          description: Ticker data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerItem'
        '404':
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
      required: [detail]

    UserRegister:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        display_name:
          type: string
      required: [email, password]

    UserLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer
        expires_in:
          type: integer
      required: [access_token, refresh_token, token_type, expires_in]

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        display_name:
          type: string
        initial_capital:
          type: number
        created_at:
          type: string
          format: date-time
      required: [id, email, initial_capital, created_at]

    ScreenerResponse:
      type: object
      properties:
        approaching:
          type: array
          items:
            type: object
        touched:
          type: array
          items:
            type: object
        last_updated:
          type: string
          format: date-time
        provider:
          type: string
        mode:
          type: string
        screener:
          type: string
        profile_meta:
          type: object
        summary:
          type: array
          items:
            type: object
        demo_mode:
          type: boolean

    BacktestRunRequest:
      type: object
      properties:
        strategy:
          type: string
          default: orb
        symbols:
          type: array
          items:
            type: string
        params:
          type: object
        days:
          type: integer
          default: 90
        include_costs:
          type: boolean
          default: true
      required: [symbols]

    BacktestRunResponse:
      type: object
      properties:
        strategy:
          type: string
        config:
          type: object
        results:
          type: array
          items:
            type: object
        totals:
          type: object
        skipped_stocks:
          type: array
          items:
            type: string
        run_time:
          type: number

    ChartData:
      type: object
      properties:
        candles:
          type: array
          items:
            type: object
            properties:
              time:
                type: string
              open:
                type: number
              high:
                type: number
              low:
                type: number
              close:
                type: number
              volume:
                type: integer
        trades:
          type: array
          items:
            type: object
        orb_zones:
          type: array
          items:
            type: object
        pivot_levels:
          type: array
          items:
            type: object

    SymbolSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              symbol:
                type: string
              name:
                type: string
              isin:
                type: string
        query:
          type: string
        total:
          type: integer

    ChartPreviewResponse:
      type: object
      properties:
        symbol:
          type: string
        candles:
          type: array
          items:
            type: object
        orb_zones:
          type: array
          items:
            type: object
        pivot_levels:
          type: array
          items:
            type: object
        timeframe:
          type: integer
        or_minutes:
          type: integer
        total_candles:
          type: integer
        error:
          type: string

    NewsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              url:
                type: string
              source:
                type: string
              timestamp:
                type: string
              category:
                type: string
        source:
          type: string
        total:
          type: integer
        fetchedAt:
          type: string
          format: date-time

    ArticleContent:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        url:
          type: string
        timestamp:
          type: string
        author:
          type: string

    PortfolioStatus:
      type: object
      properties:
        initial_capital:
          type: number
        cash:
          type: number
        margin_used:
          type: number
        position_value:
          type: number
        total_value:
          type: number
        total_pnl:
          type: number
        total_pnl_pct:
          type: number
        daily_pnl:
          type: number
        daily_pnl_pct:
          type: number
        unrealized_pnl:
          type: number
        realized_pnl_today:
          type: number
        daily_trades:
          type: integer
        positions:
          type: integer
        open_positions:
          type: integer

    Position:
      type: object
      properties:
        symbol:
          type: string
        side:
          type: string
        quantity:
          type: integer
        entry_price:
          type: number
        current_price:
          type: number
        stop_loss:
          type: number
        take_profit:
          type: number
        pnl:
          type: number
        pnl_pct:
          type: number
        margin_used:
          type: number
        entry_time:
          type: string
          format: date-time
        order_id:
          type: string

    TradeHistoryResponse:
      type: object
      properties:
        total_trades:
          type: integer
        filtered_trades:
          type: integer
        trades:
          type: array
          items:
            type: object

    OrderRequest:
      type: object
      properties:
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: integer
        price:
          type: number
        stop_loss:
          type: number
        take_profit:
          type: number
      required: [symbol, side, quantity, price, stop_loss, take_profit]

    OrderResponse:
      type: object
      properties:
        order_id:
          type: string
        status:
          type: string
        symbol:
          type: string
        side:
          type: string
        quantity:
          type: integer
        price:
          type: number
        stop_loss:
          type: number
        take_profit:
          type: number
        timestamp:
          type: string
          format: date-time

    ClosePositionRequest:
      type: object
      properties:
        symbol:
          type: string
        exit_price:
          type: number
        reason:
          type: string
          default: MANUAL
      required: [symbol, exit_price]

    TradeResult:
      type: object
      properties:
        trade_id:
          type: string
        symbol:
          type: string
        pnl:
          type: number
        pnl_pct:
          type: number
        net_pnl:
          type: number
        exit_reason:
          type: string

    BotStatus:
      type: object
      properties:
        running:
          type: boolean
        pid:
          type: integer
          nullable: true
        runner_pids:
          type: array
          items:
            type: integer
        return_code:
          type: integer
          nullable: true
        log_file:
          type: string
        pid_file:
          type: string

    BotCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_active:
          type: boolean
          default: true
        max_total_positions:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        max_total_capital_pct:
          type: number
          minimum: 0.1
          maximum: 1.0
          default: 0.8
        strategies:
          type: array
          items:
            $ref: '#/components/schemas/StrategyAllocation'
      required: [name]

    BotUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_active:
          type: boolean
        max_total_positions:
          type: integer
          minimum: 1
          maximum: 20
        max_total_capital_pct:
          type: number
          minimum: 0.1
          maximum: 1.0
        strategies:
          type: array
          items:
            $ref: '#/components/schemas/StrategyAllocation'

    BotResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
        max_total_positions:
          type: integer
        max_total_capital_pct:
          type: number
        strategies:
          type: array
          items:
            type: object
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
        running:
          type: boolean
        pid:
          type: integer
          nullable: true

    BotStatusResponse:
      type: object
      properties:
        bot_id:
          type: integer
        bot_name:
          type: string
        running:
          type: boolean
        pid:
          type: integer
          nullable: true
        portfolio:
          type: object
          nullable: true
        strategies:
          type: object
          nullable: true
        positions:
          type: array
          items:
            type: object
          nullable: true
        last_update:
          type: string
          nullable: true

    BotPortfolioResponse:
      type: object
      properties:
        bot_id:
          type: integer
        portfolio:
          type: object
          nullable: true
        positions:
          type: array
          items:
            type: object
        strategies:
          type: object
        timestamp:
          type: string
          nullable: true

    BotTradesResponse:
      type: object
      properties:
        bot_id:
          type: integer
        trades:
          type: array
          items:
            type: object
        count:
          type: integer
        strategy_filter:
          type: integer
          nullable: true

    BotPerformanceResponse:
      type: object
      properties:
        bot_id:
          type: integer
        summary:
          type: object
        by_strategy:
          type: object
        period_days:
          type: integer
        timestamp:
          type: string
          nullable: true

    StrategyAllocation:
      type: object
      properties:
        strategy_id:
          type: integer
        max_positions:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        capital_allocation_pct:
          type: number
          minimum: 0.05
          maximum: 1.0
          default: 0.2
      required: [strategy_id]

    StrategySummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        strategy_type:
          type: string
        is_template:
          type: boolean
        is_default:
          type: boolean
        sl_pct:
          type: number
        tp_pct:
          type: number
        max_positions:
          type: integer

    StrategyConfig:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        strategy_type:
          type: string
        parent_id:
          type: integer
          nullable: true
        is_template:
          type: boolean
        is_active:
          type: boolean
        is_default:
          type: boolean
        description:
          type: string
          nullable: true
        or_minutes:
          type: integer
          nullable: true
        sl_pct:
          type: number
        tp_pct:
          type: number
        min_or_range_pct:
          type: number
        max_or_range_pct:
          type: number
        max_positions:
          type: integer
        max_capital_per_trade_pct:
          type: number
        max_daily_loss_pct:
          type: number
        max_total_exposure_pct:
          type: number
        risk_per_trade_pct:
          type: number
        min_trade_value:
          type: number
        max_trade_value:
          type: number
        cooldown_minutes:
          type: integer
        max_distance_from_or_pct:
          type: number

    StrategyCreate:
      type: object
      properties:
        name:
          type: string
        strategy_type:
          type: string
        parent_id:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        or_minutes:
          type: integer
          nullable: true
        sl_pct:
          type: number
        tp_pct:
          type: number
        min_or_range_pct:
          type: number
        max_or_range_pct:
          type: number
        max_positions:
          type: integer
        max_capital_per_trade_pct:
          type: number
        max_daily_loss_pct:
          type: number
        max_total_exposure_pct:
          type: number
        risk_per_trade_pct:
          type: number
        min_trade_value:
          type: number
        max_trade_value:
          type: number
        cooldown_minutes:
          type: integer
        max_distance_from_or_pct:
          type: number
      required: [name, strategy_type]

    StrategyUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_default:
          type: boolean
        or_minutes:
          type: integer
          nullable: true
        sl_pct:
          type: number
        tp_pct:
          type: number
        min_or_range_pct:
          type: number
        max_or_range_pct:
          type: number
        max_positions:
          type: integer
        max_capital_per_trade_pct:
          type: number
        max_daily_loss_pct:
          type: number
        max_total_exposure_pct:
          type: number
        risk_per_trade_pct:
          type: number
        min_trade_value:
          type: number
        max_trade_value:
          type: number
        cooldown_minutes:
          type: integer
        max_distance_from_or_pct:
          type: number

    StrategyPerformance:
      type: object
      properties:
        strategy_id:
          type: integer
        strategy_name:
          type: string
        total_trades:
          type: integer
        winners:
          type: integer
        losers:
          type: integer
        win_rate:
          type: number
        total_pnl:
          type: number
        net_pnl:
          type: number
        test_trades:
          type: integer
        has_test_data:
          type: boolean

    TickerResponse:
      type: object
      properties:
        tickers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TickerItem'
        timestamp:
          type: string
          format: date-time
        cache_age_seconds:
          type: number

    TickerItem:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        change:
          type: number
        change_percent:
          type: number
        high:
          type: number
          nullable: true
        low:
          type: number
          nullable: true
        prev_close:
          type: number
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        is_positive:
          type: boolean
        error:
          type: string
          nullable: true
        source:
          type: string
        update_time_ms:
          type: integer
        last_updated:
          type: string
          format: date-time
          nullable: true
