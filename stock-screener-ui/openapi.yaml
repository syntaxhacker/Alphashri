  /api/options/analytics/{underlying}:
    get:
      description: 'Nearest ``expiries`` expiries of one underlying, from cache only.


        Reads the expiry ladder from the underlying cache and each chain from the

        chain cache, so a poll burst adds no Upstox calls. Any upstream/derivation

        failure is a structured ``503 analytics_unavailable``.


        Successful responses carry a browser cache window equal to the server TTL

        and a body-derived ETag; a matching ``If-None-Match`` revalidation answers

        304 without a body. The rate-limit and server-cache paths run before this,

        so both cold (charged) and warm (free) request budgets are unchanged.'
      operationId: get_options_analytics_api_options_analytics__underlying__get
      parameters:
      - in: path
        name: underlying
        required: true
        schema:
          title: Underlying
          type: string
      - description: Number of nearest expiries (1-6)
        in: query
        name: expiries
        required: false
        schema:
          default: 3
          description: Number of nearest expiries (1-6)
          maximum: 6
          minimum: 1
          title: Expiries
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsAnalyticsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 'Multi-expiry option analytics: ATM IV, 25-delta skew, smile fit and levels'
      tags:
      - options
  /api/options/chain/{underlying}:
    get:
      description: 'Get complete option chain with server-side analysis.


        Served from a single-flight short-TTL cache keyed on underlying + expiry +

        session state. Upstream failures are never cached — the loader raises before

        anything is written, so a 401/429 is retried on the next request.


        A cache hit returns the cached ``timestamp``, not a refreshed one: the field

        describes when the quotes were actually read, and the UI''s LIVE/STALE badge

        derives from it. Restamping a served-stale chain would claim a freshness the

        prices do not have.'
      operationId: get_option_chain_api_options_chain__underlying__get
      parameters:
      - in: path
        name: underlying
        required: true
        schema:
          title: Underlying
          type: string
      - description: Expiry date in YYYY-MM-DD format
        in: query
        name: expiry
        required: true
        schema:
          description: Expiry date in YYYY-MM-DD format
          title: Expiry
          type: string
      - description: Bypass the short-TTL chain cache
        in: query
        name: refresh
        required: false
        schema:
          default: false
          description: Bypass the short-TTL chain cache
          title: Refresh
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Option Chain
      tags:
      - options
  /api/options/contract-chart:
    get:
      description: 'Read-only OHLCV + open-interest series for the contract whose `instrument_key` the option chain published (for example `NSE_FO|106407`). The current session comes from Upstox''s intraday endpoint and the prior `days - 1` sessions from the historical one. Serialisation always deduplicates and sorts ascending; an empty series is a successful answer with `empty_reason: "no_trades"`.'
      operationId: get_contract_chart_api_options_contract_chart_get
      parameters:
      - description: NSE F&O contract key from the option chain.
        in: query
        name: instrument_key
        required: true
        schema:
          description: NSE F&O contract key from the option chain.
          title: Instrument Key
          type: string
      - description: 'Bar size: `1m`, `5m` or `15m`.'
        in: query
        name: interval
        required: false
        schema:
          default: 1m
          description: 'Bar size: `1m`, `5m` or `15m`.'
          title: Interval
          type: string
      - description: Sessions to return, today included (1-3).
        in: query
        name: days
        required: false
        schema:
          default: 2
          description: Sessions to return, today included (1-3).
          title: Days
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractChartResponse'
          description: Successful Response
        '400':
          description: Malformed instrument key, interval or `days`.
        '401':
          description: Upstox token missing, expired or rejected.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '502':
          description: Upstox candle data unavailable.
        '504':
          description: Upstox candle request timed out.
      summary: Minute premium candles for one option contract
      tags:
      - options
