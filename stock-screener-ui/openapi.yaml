  /api/sector:
    get:
      description: 'Fetch latest stock data and aggregate by sector.

        Based on scanners/sector_dashboard.py logic.


        Responses are cached for ``SECTOR_CACHE_TTL_SECONDS`` and concurrent cold

        requests share one upstream scan (single-flight). If a refresh fails while a

        recent snapshot is cached, the snapshot is served instead of a 500.'
      operationId: get_sector_performance_api_sector_get
      parameters:
      - in: query
        name: market
        required: false
        schema:
          default: india
          enum:
          - india
          - america
          title: Market
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 500
          maximum: 1000
          minimum: 100
          title: Limit
          type: integer
      - description: Bypass the short-lived response cache
        in: query
        name: force
        required: false
        schema:
          default: false
          description: Bypass the short-lived response cache
          title: Force
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Sector Performance
      tags:
      - sector
  /api/sector/correlation:
    get:
      description: 'Compute cross-sector correlations and relative strength metrics.


        Returns correlation matrix between major sector indices, beta vs benchmark,

        and relative strength rankings over multiple timeframes.'
      operationId: get_sector_correlation_api_sector_correlation_get
      parameters:
      - in: query
        name: market
        required: false
        schema:
          default: india
          enum:
          - india
          - america
          title: Market
          type: string
      - in: query
        name: lookback_days
        required: false
        schema:
          default: 90
          maximum: 365
          minimum: 30
          title: Lookback Days
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorCorrelationResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Sector Correlation
      tags:
      - sector
  /api/sector/groups:
    get:
      description: 'Market-cap-weighted average % change per sector/industry/theme group.


        classify=theme ranks DB-backed curated themes (see /themes): the

        TradingView frame is fetched with a wide limit so small-cap theme

        members are covered, and each theme aggregates over the members

        present in the frame.


        Fail-soft: returns an empty `groups` list on any error (never 500),

        so the frontend Themes/Industry bar list degrades gracefully.'
      operationId: get_group_performance_api_sector_groups_get
      parameters:
      - in: query
        name: classify
        required: false
        schema:
          default: sector
          enum:
          - sector
          - industry
          - theme
          title: Classify
          type: string
      - in: query
        name: period
        required: false
        schema:
          default: 1D
          enum:
          - 1D
          - 1W
          - 1M
          - 3M
          - 6M
          - YTD
          - 1Y
          title: Period
          type: string
      - in: query
        name: market
        required: false
        schema:
          default: india
          enum:
          - india
          - america
          title: Market
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 800
          maximum: 1000
          minimum: 100
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPerformanceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Group Performance
      tags:
      - sector
