        name: candles
        required: false
        schema:
          default: false
          description: Include 1-minute intraday bars (slower on a cold fetch; cached 120s)
          title: Candles
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
