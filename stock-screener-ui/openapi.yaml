  /api/market/snapshot:
    get:
      description: 'Return the whole NSE market (one TV scan) shaped for the screener.


        The (potentially 58s cold) TV scan runs off the event loop via

        ``asyncio.to_thread`` so it can never block other requests.


        ``symbols`` is optional. An empty or whitespace-only value (e.g.

        ``?symbols=``) means no filter and returns all rows; otherwise it filters

        the full snapshot to the requested symbols (max 20, deduplicated

        case-insensitively) and ``total`` is the number of matches. The filter runs

        before ``limit`` truncates the response, so a symbol outside the first

        ``limit`` rows of the universe is still found.


        ``format`` is the wire layout, not a different dataset: both layouts encode

        the same rows (``columns`` hoists the field names once and transposes the

        values; ``json`` keeps the object envelope with ``rows``). Validated before

        any scan so a typo cannot burn a TradingView call. Both layouts are encoded

        once per cached frame and served as bytes from the encoded-body cache;

        GZipMiddleware still compresses against the request''s ``Accept-Encoding``.'
      operationId: market_snapshot_api_market_snapshot_get
      parameters:
      - description: 'Universe: all_equity (default), us (US large/mid/small caps listed on NASDAQ/NYSE/AMEX), nifty50, nifty100, nifty200, nifty500, banknifty, sensex, nse_fo. indices is intentionally unsupported (see UNSERVABLE_UNIVERSES in api/market_screen/config.py for why).'
        in: query
        name: universe
        required: false
        schema:
          default: all_equity
          description: 'Universe: all_equity (default), us (US large/mid/small caps listed on NASDAQ/NYSE/AMEX), nifty50, nifty100, nifty200, nifty500, banknifty, sensex, nse_fo. indices is intentionally unsupported (see UNSERVABLE_UNIVERSES in api/market_screen/config.py for why).'
          title: Universe
          type: string
      - description: Max rows returned (1..4000).
        in: query
        name: limit
        required: false
        schema:
          default: 4000
          description: Max rows returned (1..4000).
          maximum: 4000
          minimum: 1
          title: Limit
          type: integer
      - description: Optional comma-separated symbols (max 20). Filtered against the full cached snapshot, before `limit` is applied; unknown symbols are omitted.
        in: query
        name: symbols
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional comma-separated symbols (max 20). Filtered against the full cached snapshot, before `limit` is applied; unknown symbols are omitted.
          title: Symbols
      - description: Bypass the in-process/disk cache and re-fetch from TradingView.
        in: query
        name: force
        required: false
        schema:
          default: false
          description: Bypass the in-process/disk cache and re-fetch from TradingView.
          title: Force
          type: boolean
      - description: 'Response layout: json (default, the object envelope with rows) or columns (columns-v1: fields + equal-length columns + meta). Both layouts are encoded once per cached snapshot and served from an in-process encoded-body cache.'
        in: query
        name: format
        required: false
        schema:
          default: json
          description: 'Response layout: json (default, the object envelope with rows) or columns (columns-v1: fields + equal-length columns + meta). Both layouts are encoded once per cached snapshot and served from an in-process encoded-body cache.'
          title: Format
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Market snapshot (NSE / US) for the one-page screener
      tags:
      - market
