[pytest]
# Pytest configuration for Alphashri API testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Ignore files that require external API credentials
norecursedirs = 
    tests/integration/testcontainers
    tests/needs_review
    tests/backtest
    tests/strategies

# Files to ignore (require external API credentials)
ignore = 
    tests/test_orb_conservative_integration.py
    tests/test_week52_chaser_integration.py
    tests/test_week52_target_integration.py

# Python paths
pythonpath = .

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:pytest-mock

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: marks tests related to authentication
    strategy: marks tests related to strategy management
    paper_trading: marks tests related to paper trading
    bots: marks tests related to bot management
    market_data: marks tests related to market data APIs
    screener: marks tests related to screener APIs
    backtest: marks tests related to backtest APIs
    chart: marks tests related to chart APIs
    news: marks tests related to news APIs
    asyncio: marks tests as async tests (pytest-asyncio)
    testcontainers: marks tests using testcontainers (require Docker)
    postgres: marks tests specifically testing PostgreSQL behavior
    slow_testcontainers: marks slow testcontainers tests
    contract: marks API contract tests
    e2e: marks end-to-end tests

# Asyncio mode
asyncio_mode = auto

# Coverage settings (when using pytest-cov)
[coverage:run]
source = .
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[coverage:html]
directory = htmlcov
