<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alphashri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      /*
       * Paint the stored scheme before the bundle runs. `useColorScheme` sets
       * `data-color-scheme` from an effect, which lands after the first paint —
       * a dark-mode user saw a full white page on every load until it ran.
       * Keys and fallback order mirror `src/ui/hooks.ts` exactly; this must stay
       * a few lines of ES5 because it runs before anything is polyfilled.
       * The financial theme is dark by default: the OS preference is never a
       * fallback, so a light OS can no longer paint a dark app's shell white.
       */
      (function () {
        try {
          var stored = localStorage.getItem("color-scheme") || localStorage.getItem("mui-color-scheme");
          var scheme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-color-scheme", scheme);
          document.documentElement.style.colorScheme = scheme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Mirror the already-resolved scheme onto <body> before first paint. The
         head bootstrap cannot reach <body>; without this, body[data-color-scheme]
         rules (color-scheme hints) stayed stale until the bundle mounted. -->
    <script>
      (function () {
        try {
          var scheme = document.documentElement.getAttribute("data-color-scheme") || "dark";
          document.body.setAttribute("data-color-scheme", scheme);
          document.body.style.colorScheme = scheme;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
