<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Training Metrics Animation</title>
  <script src="https://d3js.org/d3.v6.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }
    .chart {
      margin: 20px;
    }
    .axis path,
    .axis line {
      fill: none;
      stroke: #000;
      shape-rendering: crispEdges;
    }
    .line {
      fill: none;
      stroke-width: 2px;
    }
    /* Loss lines */
    .loss.train {
      stroke: steelblue;
    }
    .loss.val {
      stroke: orange;
    }
    /* Accuracy lines (dashed) */
    .acc.train {
      stroke: green;
      stroke-dasharray: 5,5;
    }
    .acc.val {
      stroke: red;
      stroke-dasharray: 5,5;
    }
  </style>
</head>
<body>
  <h1>Training Metrics Animation</h1>
  <div id="chart" class="chart"></div>
  
  <script>
    // Example training data.
    // In a real implementation, your Python training loop can export these metrics as JSON.
    // Each object contains the epoch number, training loss, validation loss, training accuracy, and validation accuracy.
    const trainingData = [
      {"epoch": 1, "train_loss": 0.75, "val_loss": 0.80, "train_acc": 0.60, "val_acc": 0.58},
      {"epoch": 2, "train_loss": 0.69, "val_loss": 0.75, "train_acc": 0.65, "val_acc": 0.62},
      {"epoch": 3, "train_loss": 0.63, "val_loss": 0.70, "train_acc": 0.70, "val_acc": 0.66},
      {"epoch": 4, "train_loss": 0.58, "val_loss": 0.66, "train_acc": 0.73, "val_acc": 0.70},
      {"epoch": 5, "train_loss": 0.54, "val_loss": 0.63, "train_acc": 0.76, "val_acc": 0.74}
      // You can add more epoch data here.
    ];
    
    // Set up SVG dimensions and margins.
    const margin = {top: 50, right: 50, bottom: 50, left: 60},
          width = 800 - margin.left - margin.right,
          height = 400 - margin.top - margin.bottom;
    
    // Append SVG object to the chart div.
    const svg = d3.select("#chart")
      .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
      .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);
    
    // Define scales.
    const xScale = d3.scaleLinear()
                     .domain([1, d3.max(trainingData, d => d.epoch)])
                     .range([0, width]);
    
    // Y scale for Loss.
    const yScaleLoss = d3.scaleLinear()
                         .domain([0, d3.max(trainingData, d => Math.max(d.train_loss, d.val_loss)) * 1.1])
                         .range([height, 0]);
    
    // Y scale for Accuracy (ranging from 0 to 1).
    const yScaleAcc = d3.scaleLinear()
                        .domain([0, 1])
                        .range([height, 0]);
    
    // Append x-axis.
    svg.append("g")
       .attr("transform", `translate(0, ${height})`)
       .call(d3.axisBottom(xScale).ticks(trainingData.length))
       .append("text")
       .attr("fill", "#000")
       .attr("x", width / 2)
       .attr("y", 35)
       .attr("text-anchor", "middle")
       .text("Epoch");
    
    // Append left y-axis (Loss).
    svg.append("g")
       .call(d3.axisLeft(yScaleLoss))
       .append("text")
       .attr("fill", "#000")
       .attr("transform", "rotate(-90)")
       .attr("y", -50)
       .attr("x", -height/2)
       .attr("dy", "1em")
       .attr("text-anchor", "middle")
       .text("Loss");
    
    // Append right y-axis (Accuracy).
    svg.append("g")
       .attr("transform", `translate(${width}, 0)`)
       .call(d3.axisRight(yScaleAcc))
       .append("text")
       .attr("fill", "#000")
       .attr("transform", "rotate(-90)")
       .attr("y", 40)
       .attr("x", -height/2)
       .attr("dy", "-1.2em")
       .attr("text-anchor", "middle")
       .text("Accuracy");
    
    // Define line generators for each metric.
    const lineTrainLoss = d3.line()
                            .x(d => xScale(d.epoch))
                            .y(d => yScaleLoss(d.train_loss));
    
    const lineValLoss = d3.line()
                          .x(d => xScale(d.epoch))
                          .y(d => yScaleLoss(d.val_loss));
    
    const lineTrainAcc = d3.line()
                           .x(d => xScale(d.epoch))
                           .y(d => yScaleAcc(d.train_acc));
    
    const lineValAcc = d3.line()
                         .x(d => xScale(d.epoch))
                         .y(d => yScaleAcc(d.val_acc));
    
    // Append the paths (initially with no data points).
    const pathTrainLoss = svg.append("path")
                             .attr("class", "line loss train")
                             .attr("d", lineTrainLoss([]));
    
    const pathValLoss = svg.append("path")
                           .attr("class", "line loss val")
                           .attr("d", lineValLoss([]));
    
    const pathTrainAcc = svg.append("path")
                            .attr("class", "line acc train")
                            .attr("d", lineTrainAcc([]));
    
    const pathValAcc = svg.append("path")
                          .attr("class", "line acc val")
                          .attr("d", lineValAcc([]));
    
    // Animation: Gradually reveal data points per epoch.
    let currentEpoch = 0;
    const totalEpochs = trainingData.length;
    
    function updateChart() {
      currentEpoch++;
      if (currentEpoch > totalEpochs) return;
      
      // Subset of data for the current frame of animation.
      const subsetData = trainingData.filter(d => d.epoch <= currentEpoch);
      
      // Update paths with transitions.
      pathTrainLoss.datum(subsetData)
                   .transition()
                   .duration(500)
                   .attr("d", lineTrainLoss);
      
      pathValLoss.datum(subsetData)
                 .transition()
                 .duration(500)
                 .attr("d", lineValLoss);
      
      pathTrainAcc.datum(subsetData)
                  .transition()
                  .duration(500)
                  .attr("d", lineTrainAcc);
      
      pathValAcc.datum(subsetData)
                .transition()
                .duration(500)
                .attr("d", lineValAcc);
    }
    
    // Update the chart every second.
    d3.interval(() => {
      updateChart();
    }, 1000);
    
  </script>
</body>
</html>
