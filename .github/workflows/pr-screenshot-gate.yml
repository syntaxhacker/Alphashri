name: PR Screenshot Gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-screenshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: PR body screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check PR body for embedded screenshots
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node .github/scripts/check-pr-screenshots.mjs
