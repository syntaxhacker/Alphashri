[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --strict-config
    --cov=screeners
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (slower, may require external data)
    slow: marks tests as slow running tests
    historical_data: marks tests that require historical market data
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning