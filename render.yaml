services:
  - type: web
    name: alphashri-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: stock-screener-ui/Dockerfile.prod
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8765
      - key: REQUIRE_AUTH
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://alphashri.pages.dev
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: alphashri-db
          property: connectionString

databases:
  - name: alphashri-db
    plan: free
    databaseName: alphashri
    user: alphashri
